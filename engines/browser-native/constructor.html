<!doctype html>
<meta charset="utf-8">
<title>Melee native constructor probe</title>
<h1>Original fighter constructor probe</h1>
<p>Development probe. This page does not run a playable match.</p>
<pre id="result">Loading hosted assets…</pre>
<script type="module">
import create from './melee-fighter-init.mjs';
import {archiveRootView,inspectArchive} from './archive.mjs';
import {createNativeMatchPreview} from './native-match-preview.mjs';
import {verifyCombat} from './verify-combat.mjs';
import {verifyResidentEffectBank} from './verify-effects.mjs';
import {verifyStartup} from './verify-startup.mjs';
import {convertFighterBase} from './fighter-base-assets.mjs';
import {readFighterMotions} from './motion-assets.mjs';
import {convertMotionAnimations} from './motion-animations.mjs';
import {motionSpec} from './motion-spec.mjs';
import {attributeSpec} from './attribute-spec.mjs';
import {convertCaptainEffects,convertCommonEffects} from './effect-assets.mjs';
import {convertBattlefieldMap} from './stage-map-assets.mjs';
import {convertStageCollision} from './stage-collision.mjs';
import {loadCostume} from './costume-assets.mjs';
import {installResidentFile,installResidentBytes,openResidentArchive} from './resident-files.mjs';
const diagnostics=[],report={constructorAttempted:false,constructorCompleted:false,playable:false,performanceMeasured:false};
const render=new URLSearchParams(location.search).has('render'),previewActors=[];
const capture=line=>{diagnostics.push(String(line));if(diagnostics.length>64)diagnostics.shift();console.log(String(line));};
try {
  async function asset(name){const r=await fetch('./fixtures/'+name);if(!r.ok)throw Error('Hosted asset unavailable: '+name);return new Uint8Array(await r.arrayBuffer());}
  const modelNames=await (await fetch('./model-fixtures.json')).json();
  const [module,common,baseBytes,animationBytes,models]=await Promise.all([create({print:capture,printErr:capture}),asset('PlCo.dat'),asset('PlCa.dat'),asset('PlCaAJ.dat'),Promise.all(modelNames.map(async name=>({name,bytes:await asset(name)})))]);
  report.startupPassed=verifyStartup(module,common,models).passed;
  for(let byte=0;byte<256;byte++)if(module._portPackedFlagBits(byte)!==byte)throw Error('Packed game flag byte changed');
  report.packedFlagCases=256;
  const view=()=>new DataView(module.HEAPU8.buffer),ptr=at=>view().getUint32(at,true),kind=2;
  const partCount=ptr(ptr(module._portSharedGlobal(4)+kind*4)+8),costumes=module._portCostumeCount(kind);
  const source=convertFighterBase(baseBytes,'PlCa.dat',{motionSpec,attributeSpec,partCount,costumes});
  installResidentFile(module,'PlCa.dat',source.image);
  const file=openResidentArchive(module,'PlCa.dat',['ftDataCaptain']),root=file.addresses[0],image=new DataView(source.image.buffer),bodySize=image.getUint32(4,true),relocations=new Set();
  for(let i=0;i<image.getUint32(8,true);i++)relocations.add(image.getUint32(32+bodySize+i*4,true));
  let checks=0;
  for(let i=0;i<24;i++){checks++;if(ptr(root+i*4)!==(source.fields[i]===null?0:root+source.fields[i]))throw Error('Complete base root relocation '+i);}
  for(let at=0;at<bodySize;){checks++;if(relocations.has(at)){if(ptr(root+at)!==root+image.getUint32(32+at,true))throw Error('Base subgraph relocation '+at);at+=4;}else {if(module.HEAPU8[root+at]!==source.image[32+at])throw Error('Base subgraph payload '+at);at++;}}
  file.dispose();
  report.baseArchive={passed:true,checks,bytes:source.image.length,partCount,costumes,motionRows:source.motionCount,demoRows:source.demoCount,imports:source.imports,relocations:relocations.size};
  const motions=readFighterMotions(baseBytes,'PlCa.dat',motionSpec),bundle=convertMotionAnimations(animationBytes,motions.motions);
  installResidentBytes(module,'PlCaAJ.dat',bundle.image);
  loadCostume(module,models.find(m=>m.name==='PlCaNr.dat').bytes,'PlCaNr.dat',kind);
  module._portMatchCameraInitialize();
  module._portEffectsInitialize();
  const effects=convertCommonEffects(await asset('EfCoData.dat'));
  installResidentFile(module,'EfCoData.dat',effects.image);
  const effectData=module._portCommonEffectsLoad();
  if(!effectData)throw Error('Original common effect-bank loader failed');
  report.commonEffects=verifyResidentEffectBank(module,effects,effectData);
  installResidentFile(module,'EfCaData.dat',convertCaptainEffects(await asset('EfCaData.dat')).image);
  module._portMatchPlayerInitialize();
  module._portFighterPlayerConfigure(0,0,0,0,0,1,0);
  const withStage=new URLSearchParams(location.search).has('stage'),combat=new URLSearchParams(location.search).has('combat');
  if(combat){if(module._portProbeRulesInitialize()!==1)throw Error('Original default damage ratio');module._portFighterPlayerConfigure(1,1,0,1,1,1,0);}
  if(withStage){
    const stageBytes=await asset('GrNBa.dat'),map=convertBattlefieldMap(stageBytes);
    installResidentFile(module,'NativeBattlefieldMap.dat',map.image);
    const stageFile=openResidentArchive(module,'NativeBattlefieldMap.dat',['native_stage_map','native_stage_parameters']);
    module._portStageMapInstall(stageFile.archive,...stageFile.addresses);
    const collision=convertStageCollision(stageBytes);
    installResidentFile(module,'NativeBattlefieldCollision.dat',collision.image);
    const collisionFile=openResidentArchive(module,'NativeBattlefieldCollision.dat',['coll_data']);
    module._portStageMapCollisionLoad(collisionFile.addresses[0]);
    const cd=new DataView(collision.image.buffer,32),verts=cd.getUint32(0,true),count=cd.getUint32(4,true),scale=view().getFloat32(stageFile.addresses[1],true);
    if(module._portStageMapCollisionRead(0,0)!==count)throw Error('Stage collision vertex count');
    for(let i=0;i<count;i++)for(let axis=0;axis<2;axis++)if(module._portStageMapCollisionRead(1+axis,i)!==Math.fround(cd.getFloat32(verts+i*8+axis*4,true)*scale))throw Error('Stage collision world vertex');
    for(const id of [0,3,1,6]) {
      const object=module._portStageMapCreate(id);
      if(render)previewActors.push({name:'Battlefield group '+id,object,extraRoot:1,bytes:archiveRootView(inspectArchive(stageBytes),'stage_Share_joint',new DataView(map.image.buffer,32).getUint32(map.table+id*52,true))});
    }
    module._portStageMapBounds();module._portStageMapSpawn(0);
    if(render)module._portStageRenderInitialize();
    report.stage={name:'Battlefield',collisionLoaded:true,vertexChecks:count*2,modelGroups:[0,3,1,6],completeStageStartup:false};
  }
  report.constructorAttempted=true;
  console.log('NATIVE_CONSTRUCTOR_START '+JSON.stringify(report));
  const object=module._portFighterConstruct(kind,0);
  if(!object)throw Error('Original constructor returned no fighter');
  report.constructorCompleted=true;report.object=object;
  const state=()=>Array.from({length:13},(_,i)=>module._portFighterConstructRead(object,i));
  report.state=state();
  if(!report.state.every(Number.isFinite)||!report.state[7]||!report.state[8]||report.state[9]!==15||report.state[10]!==1||report.state[11]!==kind||report.state[12]!==0)throw Error('Constructed fighter state/ownership invariant');
  report.constructorVerified=true;
  let opponent=0;
  const combatState=o=>Array.from({length:19},(_,i)=>module._portFighterConstructRead(o,i));
  if(combat){
    module._portStageMapSpawn(1);opponent=module._portFighterConstruct(kind,1);
    if(!opponent||opponent===object)throw Error('Second original constructor failed');
    const a=combatState(object),b=combatState(opponent);
    if(b[9]!==15||b[10]!==1||b[11]!==kind||b[12]!==1||a[8]!==b[8]||a[7]===b[7])throw Error('Shared kind / independent fighter ownership');
    report.combat={completed:false,initial:[a,b],frames:0};
  }
  if(render||new URLSearchParams(location.search).has('camera')){module._portStageCameraStart();report.cameraStarted=true;}
  if(new URLSearchParams(location.search).has('step')){
    report.schedulerContext=combat?'Battlefield geometry/collision, default rules, two player-owned Falcons and scripted normalized combat input. Full match startup and rendering remain incomplete.':withStage?'Battlefield geometry/collision and source spawn, without complete Stage startup, match rules, input or rendering.':'Isolated bring-up without stage, match rules, input or rendering. Empty bounds cause death/rebirth; this is not gameplay validation.';
    report.schedulerSteps=0;console.log('NATIVE_CONSTRUCTOR_START '+JSON.stringify(report));
    for(let i=0;i<120;i++){module._portRuntimeStep();report.schedulerSteps++;}
    report.afterSteps=state();
    if(!report.afterSteps.every(Number.isFinite)||report.afterSteps[9]!==15||report.afterSteps[10]!==1)throw Error('Scheduled fighter state/ownership invariant');
    if(withStage&&(report.afterSteps[0]!==14||report.afterSteps[3]!==0))throw Error('Fighter did not land into Wait on Battlefield');
    let preview,canvas;
    if(render) {
      for(const [i,owner] of [object,opponent].entries())if(owner)previewActors.push({name:'Falcon P'+(i+1),object:owner,prepare:()=>module._portFighterPreviewPrepare(owner),finish:()=>module._portFighterPreviewFinish(owner),bytes:models.find(m=>m.name==='PlCaNr.dat').bytes});
      canvas=document.createElement('canvas');canvas.width=960;canvas.height=720;canvas.id='native-preview';document.querySelector('#result').before(canvas);
      preview=createNativeMatchPreview(module,canvas,previewActors);report.preview={settled:preview.draw()};
      const initial=document.createElement('img');initial.id='native-preview-settled';initial.width=960;initial.height=720;initial.src=canvas.toDataURL();canvas.before(initial);
    }
    if(combat)await verifyCombat(module,[object,opponent],report.combat,{
      control:new URLSearchParams(location.search).has('control'),camera:report.cameraStarted===true,
      progress:()=>console.log('NATIVE_CONSTRUCTOR_START '+JSON.stringify(report)),
    });
    if(preview){report.preview.final=preview.draw();preview.dispose();}
    if(new URLSearchParams(location.search).has('input')){
      report.input={completed:false,frames:0,states:[]};
      module._Player_80031848(0);
      console.log('NATIVE_CONSTRUCTOR_START '+JSON.stringify(report));
      for(const [name,frames,buttons,x,y] of [['walk',12,0,0.5,0],['release',12,0,0,0],['jump',4,0x400,0,0],['air',20,0,0,0],['attack',4,0x100,0,0],['recover',90,0,0,0]]){
        for(let i=0;i<frames;i++){module._portStageProbePad(0,buttons,x,y);module._portRuntimeStep();report.input.frames++;}
        report.input.states.push({name,state:state()});
        const latest=report.input.states.at(-1).state;
        if(name==='walk'&&(!(latest[4]>report.afterSteps[4])||![15,16,17].includes(latest[0])))throw Error('Scripted walking input did not produce walking movement');
        if(name==='air'&&(latest[3]!==1||latest[5]<=report.afterSteps[5]))throw Error('Scripted jump did not become airborne');
        if(name==='attack'&&!(latest[0]>=65&&latest[0]<=69))throw Error('Scripted aerial attack did not enter an aerial attack state');
        if(name==='recover'&&(latest[0]!==14||latest[3]!==0))throw Error('Fighter did not recover into grounded Wait');
      }
      report.input.completed=true;
    }
  }
} catch(error){report.error=String(error.stack||error);report.diagnostics=diagnostics;}
document.querySelector('#result').textContent=JSON.stringify(report,null,2);
document.documentElement.dataset.result=report.constructorCompleted?'constructed':'blocked';
console.log('NATIVE_CONSTRUCTOR_RESULT '+JSON.stringify(report));
</script>
