<!doctype html>
<meta charset="utf-8">
<title>Melee native port — original fighter startup</title>
<h1>Original fighter startup verification</h1>
<p>Hosted assets and original initialization code. No playable match or performance claim.</p>
<pre id="result">Loading hosted assets…</pre>
<script type="module">
import create from './melee-startup.mjs';
import {verifyStartup,verifyStartupOrder} from './verify-startup.mjs';
try {
  async function asset(name){const response=await fetch('./fixtures/'+name);if(!response.ok)throw Error('Hosted asset unavailable: '+name);return new Uint8Array(await response.arrayBuffer());}
  const response=await fetch('./model-fixtures.json');if(!response.ok)throw Error('Hosted model manifest unavailable');
  const names=await response.json();if(names.some(name=>!/^Pl[A-Za-z0-9]+\.(dat|usd)$/.test(name)))throw Error('Invalid hosted model name');
  const [module,common,models]=await Promise.all([create(),asset('PlCo.dat'),Promise.all(names.map(async name=>({name,bytes:await asset(name)})))]);
  const report=verifyStartup(module,common,models);
  report.startupOrder=verifyStartupOrder(await create(),common);
  document.querySelector('#result').textContent=JSON.stringify(report,null,2);document.documentElement.dataset.result='passed';
} catch(error){document.querySelector('#result').textContent=String(error.stack||error);document.documentElement.dataset.result='failed';}
</script>
