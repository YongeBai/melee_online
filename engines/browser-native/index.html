<!doctype html>
<meta charset="utf-8">
<title>Melee native port — subsystem verification</title>
<h1>Native port development</h1>
<p>This verifies decompiled C running directly in WebAssembly. It is not a playable game or a frame-rate test.</p>
<pre id="result">Loading native module…</pre>
<script type="module">
import createMeleeNative from './melee-native.mjs';
import {verifyNative} from './verify.mjs';
try {
  const module=await createMeleeNative();
  async function loadFixtures(manifest) {
  const response=await fetch('./'+manifest);
  const files=response.ok?await response.json():[];
  return await Promise.all(files.map(async name=> {
    if(!/^(Gr|Pl)[A-Za-z0-9]+\.(dat|usd)$/.test(name))throw Error('Invalid asset filename');
    const response=await fetch('./fixtures/'+name);
    if(!response.ok)throw Error('Hosted stage unavailable');
    return {name,bytes:new Uint8Array(await response.arrayBuffer())};
  }));
  }
  const [stages,fighters,animations,models]=await Promise.all([loadFixtures('stage-fixtures.json'),loadFixtures('fighter-fixtures.json'),loadFixtures('animation-fixtures.json'),loadFixtures('model-fixtures.json')]);
  const report=await verifyNative(module,stages,fighters,animations,
    {models,allAnimations:new URL(location.href).searchParams.get('allanimations')==='1'});
  document.getElementById('result').textContent=JSON.stringify(report,null,2);
  document.documentElement.dataset.result='passed';
} catch(error) {
  document.getElementById('result').textContent=String(error.stack||error);
  document.documentElement.dataset.result='failed';
}
</script>
