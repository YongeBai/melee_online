<!doctype html>
<meta charset="utf-8">
<title>Melee native port — original per-fighter initialization</title>
<h1>Original per-fighter initialization</h1>
<p>Hosted assets and original fighter initialization. This diagnostic does not run a match.</p>
<pre id="result">Loading hosted assets…</pre>
<script type="module">
import create from './melee-fighter-init.mjs';
import {verifyItemModels} from './verify-item-models.mjs';
import {verifyCommandFields} from './verify-commands.mjs';
import {verifyStartup,verifyStartupOrder} from './verify-startup.mjs';
import {verifyDynamics} from './verify-dynamics.mjs';
import {verifyFighterInitialization} from './verify-fighter-init.mjs';
const diagnostics=[];
const capture=line=>{diagnostics.push(String(line));if(diagnostics.length>64)diagnostics.shift();};
try {
  async function asset(name){const response=await fetch('./fixtures/'+name);if(!response.ok)throw Error('Hosted asset unavailable: '+name);return new Uint8Array(await response.arrayBuffer());}
  async function load(manifest){const response=await fetch('./'+manifest);if(!response.ok)throw Error('Hosted manifest unavailable');const names=await response.json();if(names.some(n=>!/^Pl[A-Za-z0-9]+\.(dat|usd)$/.test(n)))throw Error('Invalid hosted filename');return Promise.all(names.map(async name=>({name,bytes:await asset(name)})));}
  const [module,common,models,fighters,animations]=await Promise.all([create({print:capture,printErr:capture}),asset('PlCo.dat'),load('model-fixtures.json'),load('fighter-fixtures.json'),load('animation-fixtures.json')]);
  const report=verifyStartup(module,common,models);
  report.startupOrder=verifyStartupOrder(await create(),common);
  report.perFighter=verifyFighterInitialization(module,fighters,models);
  report.commandFields=verifyCommandFields(module);
  report.dynamics=verifyDynamics(module,fighters,models,animations);
  report.itemModels=verifyItemModels(module,fighters);
  document.querySelector('#result').textContent=JSON.stringify(report,null,2);document.documentElement.dataset.result='passed';
} catch(error){document.querySelector('#result').textContent=String(error.stack||error)+'\n'+diagnostics.join('\n');document.documentElement.dataset.result='failed';}
</script>
