<!doctype html>
<meta charset="utf-8">
<title>Melee native port — article scripts</title>
<h1>Original article script verification</h1>
<p>Hosted Fox/Falco article data and original command handlers. This is a subsystem test, not a playable match.</p>
<pre id="result">Loading hosted assets…</pre>
<script type="module">
import create from './melee-fighter-init.mjs';
import {verifyArticles,verifyItemCommon} from './verify-articles.mjs';
import {verifyCommandFields} from './verify-commands.mjs';
try {
  const [module,fixtures]=await Promise.all([create(),Promise.all(['PlFx.dat','PlFc.dat','ItCo.usd'].map(async name=>{
    const response=await fetch('./fixtures/'+name);if(!response.ok)throw Error('Hosted article asset unavailable: '+name);
    return {name,bytes:new Uint8Array(await response.arrayBuffer())};
  }))]);
  module._portSceneInitialize();
  const report={commands:verifyCommandFields(module),common:verifyItemCommon(module,fixtures[2].bytes),articles:verifyArticles(module,fixtures.slice(0,2)),playable:false,performanceMeasured:false};
  document.querySelector('#result').textContent=JSON.stringify(report,null,2);document.documentElement.dataset.result='passed';
} catch(error){document.querySelector('#result').textContent=String(error.stack||error);document.documentElement.dataset.result='failed';}
</script>
