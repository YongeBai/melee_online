<!doctype html>
<meta charset="utf-8">
<title>Melee native port — original HSD scene verification</title>
<h1>Original HSD scene verification</h1>
<p>Native object loading, animation and lifetime checks. This is not a playable match or a performance test.</p>
<pre id="result">Loading hosted assets…</pre>
<script type="module">
import {verifyAttributes} from './verify-attributes.mjs';
import {verifyCharacterCollision} from './verify-character-collision.mjs';
import {verifyCommonInitialization} from './verify-common-initialization.mjs';
import {verifyShared} from './verify-shared.mjs';
import {verifyMotions} from './verify-motions.mjs';
import create from './melee-scene.mjs';
import {verifyResidentFiles,verifyResidentLifecycle} from './verify-resident-files.mjs';
import {verifyScene,verifySceneAnimations} from './verify-scene.mjs';
try {
  const module=await create();module._portRuntimeInit();
  async function load(manifest) {
    const response=await fetch('./'+manifest);if(!response.ok)throw Error('Hosted manifest unavailable');
    return await Promise.all((await response.json()).map(async name=>{
      if(!/^Pl[A-Za-z0-9]+\.(dat|usd)$/.test(name))throw Error('Invalid hosted asset');
      const response=await fetch('./fixtures/'+name);if(!response.ok)throw Error('Hosted asset unavailable');
      return {name,bytes:new Uint8Array(await response.arrayBuffer())};
    }));
  }
  const [models,animations,fighters]=await Promise.all([load('model-fixtures.json'),load('animation-fixtures.json'),load('fighter-fixtures.json')]);
  const attributes=verifyAttributes(module,fighters);
  const report=verifyScene(module,models);report.residentFiles=verifyResidentFiles(module,models);report.residentFiles.lifecycle=verifyResidentLifecycle(module);report.animations=verifySceneAnimations(module,models,animations);
  report.attributes=attributes;
  const [shared]=await load('shared-fixtures.json');report.shared=verifyShared(module,shared.bytes);
  report.motions=verifyMotions(module,fighters,animations,models);
  report.commonInitialization=verifyCommonInitialization(module,shared.bytes);
  report.characterCollision=verifyCharacterCollision(module,fighters,models,animations);
  document.querySelector('#result').textContent=JSON.stringify(report,null,2);document.documentElement.dataset.result='passed';
} catch(error) {document.querySelector('#result').textContent=String(error.stack||error);document.documentElement.dataset.result='failed';}
</script>
