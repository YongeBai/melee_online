<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Melee Online</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}main{height:100dvh;display:grid;place-items:center}#screen{width:min(100vw,133.333dvh);height:min(75vw,100dvh);object-fit:contain;background:#000;outline:none}#loading,#pause{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000d;text-align:center;gap:16px}#loading h1{font-style:italic;letter-spacing:.08em;font-size:clamp(24px,5vw,50px)}#forms label{display:block;margin:8px}#forms[hidden]{display:none}#loading p{max-width:600px;color:#bbc7e2}button,a{font:inherit;color:white;background:#141e37;border:1px solid #8495bd;padding:10px 20px;cursor:pointer}#pause[hidden],#loading[hidden]{display:none}#toolbar{position:fixed;top:8px;right:8px;display:flex;gap:4px;opacity:.15;transition:opacity .2s}#toolbar:hover,#toolbar:focus-within{opacity:1}#toolbar button{padding:6px 10px;font-size:12px}#stats{position:fixed;bottom:4px;left:6px;font-size:11px;color:#ddd;background:#000a;pointer-events:none}#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#000a;padding:5px 10px;font-size:13px;white-space:nowrap}#qa{position:fixed;bottom:30px;left:8px;max-width:96vw;background:#102035ed;font-size:11px}#qa pre{max-height:180px;overflow:auto;white-space:pre-wrap}
</style></head><body><main><canvas id="screen" width="640" height="480" tabindex="0" aria-label="Super Smash Bros. Melee"></canvas></main>
<div id="loading"><h1>SUPER SMASH BROS. Melee</h1><p id="status" role="status">Loading your local game disc…</p><button id="begin" hidden>Start Melee</button></div>
<div id="pause" hidden><h1>PAUSED</h1><button id="resume">Resume · Esc</button><label><input id="tapJump" type="checkbox"> Tap jump</label><div id="forms"><p>Zelda starting form</p><label><input id="playerSheik" type="checkbox"> Player: Sheik</label><label><input id="cpuSheik" type="checkbox"> CPU: Sheik</label></div><button id="quit">Character select</button><a href="/">Controls</a></div>
<div id="toolbar"><button id="pauseButton" aria-label="Pause">Ⅱ</button><button id="fullscreen">Fullscreen</button><button id="metrics">FPS</button></div>
<output id="stats" hidden></output><div id="hint" hidden>WASD · move cursor　P · select　O · back　Enter · start match　Esc · pause</div>
<script type="module" src="/play/melee-runtime.js"></script></body></html>
