<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Melee Online</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/play/melee-ui.css" />
  </head>
  <body>
    <main>
      <div id="gameViewport">
        <canvas
          id="screen"
          width="640"
          height="480"
          tabindex="0"
          aria-label="Super Smash Bros. Melee"
        ></canvas>
        <span
          id="keyboardButton"
          hidden
          role="img"
          aria-label="Player 1 keyboard controls"
          title="Point the hand here and press P"
        >
          <svg viewBox="0 0 32 22" aria-hidden="true">
            <rect x="1" y="1" width="30" height="20" rx="3" />
            <path d="M5 6h3m3 0h3m3 0h3m3 0h3M5 11h3m3 0h3m3 0h3m3 0h3M7 16h18" />
          </svg>
        </span>
      </div>
    </main>
    <div id="loading">
      <section class="loading-card" aria-label="Starting Melee">
        <div class="loading-label"><span id="loadingFallback">Loading</span><canvas id="loadingLabel" hidden aria-label="Loading"></canvas></div>
        <div class="loading-track" aria-hidden="true"><span></span></div>
        <p id="status" role="status">Preparing your room…</p>
        <button id="begin" hidden>Retry</button>
      </section>
    </div>
    <dialog id="controls" aria-label="Player 1 keyboard controls">
      <div class="controls-surface">
        <label class="tap-setting"
          ><img class="tap-label" src="/play/assets/tap-jump.png" alt="Tap jump" /><input
            id="tapJump"
            type="checkbox"
            role="switch" /><span class="toggle" aria-hidden="true"></span
        ></label>
        <div
          id="keyboardModel"
          role="img"
          aria-label="3D keyboard: WASD control stick, P A, O B, Space X, I L, L R, U Z, K M comma period C-stick, Shift half stick, Enter Start, Esc pause and unpause"
        ></div>
        <button id="closeControls" class="menu-button" aria-label="Close keyboard controls">
          <img src="/play/assets/MnMaAll-1bf200.png" alt="Back" />
        </button>
      </div>
    </dialog>
    <div id="toolbar">
      <label class="volume-control">Volume <input id="volume" type="range" min="0" max="100" step="1" value="25" aria-label="Game volume" /></label>
      <button id="fullscreen">Fullscreen</button><button id="metrics">FPS</button>
    </div>
    <output id="stats" hidden></output>
    <script type="module" src="/play/melee-runtime.js"></script>
  </body>
</html>
